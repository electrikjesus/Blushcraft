name: Create Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: stable
        cache: true

    - name: Decode signing keystore
      env:
        SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
      run: bash .github/scripts/decode-signing-keystore.sh android/app/release.keystore

    - name: Build Release APK
      env:
        RELEASE_STORE_FILE: app/release.keystore
        RELEASE_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        RELEASE_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        RELEASE_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
      run: |
        chmod +x tool/build_apk.sh tool/git_version.sh
        ./tool/build_apk.sh

    - name: Build Debug APK
      run: |
        source tool/git_version.sh
        flutter build apk --debug \
          --build-name="${BLUSH_BUILD_NAME}" \
          --build-number="${BLUSH_BUILD_NUMBER}"

    - name: Verify release APK signature
      run: jarsigner -verify -verbose -certs build/app/outputs/flutter-apk/app-release.apk

    - name: Generate release notes
      run: bash .github/scripts/generate-release-notes.sh "${{ github.ref_name }}" > release-notes.md

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          build/app/outputs/flutter-apk/app-debug.apk
          build/app/outputs/flutter-apk/app-release.apk
        body_path: release-notes.md
        generate_release_notes: false
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Remove signing keystore
      if: always()
      run: rm -f android/app/release.keystore
